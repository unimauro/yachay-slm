name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest   # sin MLX ni Rust: prueba el motor portable (NumPy puro)
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-portable.txt
          pip install -r requirements-mate.txt
          pip install pytest
      - name: Tests (motor NumPy, sandbox SymPy, traductor)
        run: pytest tests/ -q
      - name: Smoke — inferencia portable con el modelo demo
        run: python -m src.portable.run --ckpt models/demo/yachay-demo.safetensors --prompt "hola"
      - name: Smoke — mate determinista → SymPy
        run: python -m src.mate --prompt "Deriva x^2 respecto a x."
